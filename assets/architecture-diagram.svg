<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <style>
    .box { fill:#333; stroke:#ffc107; stroke-width:2; rx:8; }
    .text { fill:#fff; font-family:Arial,Helvetica,sans-serif; font-size:14px; }
    .arrow { stroke:#ffc107; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffc107" />
    </marker>
  </defs>

  <rect class="box" x="20" y="20" width="160" height="40" />
  <text class="text" x="100" y="45" text-anchor="middle">Visitor</text>

  <rect class="box" x="220" y="20" width="180" height="40" />
  <text class="text" x="310" y="45" text-anchor="middle">Cloudflare DNS / CDN</text>

  <rect class="box" x="440" y="20" width="160" height="40" />
  <text class="text" x="520" y="45" text-anchor="middle">Hetzner VPS</text>

  <rect class="box" x="20" y="110" width="180" height="40" />
  <text class="text" x="110" y="135" text-anchor="middle">Ubuntu Linux</text>

  <rect class="box" x="240" y="110" width="160" height="40" />
  <text class="text" x="320" y="135" text-anchor="middle">Nginx Web Server</text>

  <rect class="box" x="460" y="110" width="140" height="40" />
  <text class="text" x="530" y="135" text-anchor="middle">PHP-FPM</text>

  <rect class="box" x="240" y="200" width="220" height="40" />
  <text class="text" x="350" y="225" text-anchor="middle">Website Content</text>

  <path class="arrow" d="M180 40 L220 40" />
  <path class="arrow" d="M400 40 L440 40" />
  <path class="arrow" d="M520 60 L520 110" />
  <path class="arrow" d="M320 60 L320 110" />
  <path class="arrow" d="M380 150 L460 150" />
  <path class="arrow" d="M320 150 L320 200" />
</svg>